<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บอร์ดสด - บ่อตกกุ้ง</title>
  <script src="config.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
    
    :root {
      --bg-dark: #0f111a;
      --card-bg: #1c1f2e;
      --card-border: #2a2d3d;
      --blue-main: #3b82f6;
      --red-main: #ef4444;
      --green-main: #10b981;
      --yellow-main: #f59e0b;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Kanit', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .dashboard-container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--card-border);
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
    }
    .window-controls { display: flex; gap: 8px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }
    .title-area { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; font-weight: 500; }
    .live-badge { background: rgba(16, 185, 129, 0.2); color: var(--green-main); padding: 4px 12px; border-radius: 20px; font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .live-dot { width: 8px; height: 8px; background: var(--green-main); border-radius: 50%; box-shadow: 0 0 10px var(--green-main); }

    /* Header Info */
    .header-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
    }
    .round-id { font-size: 1.8rem; font-weight: 700; margin-bottom: 5px; }
    .round-status { color: var(--text-muted); font-size: 1rem; }
    .timer-area { text-align: right; }
    .timer-label { color: var(--text-muted); font-size: 1rem; margin-bottom: 5px; }
    .timer-value { font-size: 2.5rem; font-weight: 700; color: var(--yellow-main); line-height: 1; }

    /* Cards */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .card {
      background: #171925;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 30px;
      position: relative;
      overflow: hidden;
    }
    .card.even { border-color: rgba(59, 130, 246, 0.3); }
    .card.odd { border-color: rgba(239, 68, 68, 0.3); }
    
    .card-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 15px; }
    .card.even .card-title { color: var(--blue-main); }
    .card.odd .card-title { color: var(--red-main); }
    
    .card-amount { font-size: 3.5rem; font-weight: 700; margin-bottom: 15px; letter-spacing: -1px; }
    .card-stats { color: var(--text-muted); font-size: 1rem; margin-bottom: 15px; }
    
    .progress-bar { width: 100%; height: 6px; background: #2a2d3d; border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 3px; }
    .card.even .progress-fill { background: var(--blue-main); width: 60%; box-shadow: 0 0 10px var(--blue-main); }
    .card.odd .progress-fill { background: var(--red-main); width: 40%; box-shadow: 0 0 10px var(--red-main); }

    /* Total & Last Result */
    .summary-card {
      background: #171925;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 25px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .summary-label { font-size: 1.2rem; color: var(--text-muted); }
    .summary-total { font-size: 2.2rem; font-weight: 700; color: var(--green-main); }

    .last-result-card {
      background: #171925;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 25px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .last-result-left { display: flex; align-items: center; gap: 20px; }
    .scale-icon { font-size: 2.5rem; color: var(--text-muted); }
    .last-result-text { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 5px; }
    .last-result-weight { font-size: 2rem; font-weight: 700; }
    .winner-badge {
      background: rgba(59, 130, 246, 0.2);
      color: var(--blue-main);
      padding: 8px 24px;
      border-radius: 30px;
      font-size: 1.2rem;
      font-weight: 600;
      border: 1px solid rgba(59, 130, 246, 0.5);
    }
    .winner-badge.odd {
      background: rgba(239, 68, 68, 0.2);
      color: var(--red-main);
      border-color: rgba(239, 68, 68, 0.5);
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="window-controls">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
      </div>
      <div class="title-area">
        🦐 บอร์ดสด — บ่อตกกุ้ง
      </div>
      <div class="live-badge">
        <div class="live-dot"></div> LIVE
      </div>
    </div>

    <!-- Header -->
    <div class="header-info">
      <div>
        <div class="round-id" id="roundIdDisplay">รอบ R-......-..</div>
        <div class="round-status" id="statusDisplay">กำลังเชื่อมต่อข้อมูล...</div>
      </div>
      <div class="timer-area">
        <div class="timer-label">เหลือเวลา</div>
        <div class="timer-value" id="timerDisplay">--:--</div>
      </div>
    </div>

    <!-- Cards (Even / Odd) -->
    <div class="cards-grid">
      <!-- Even -->
      <div class="card even">
        <div class="card-title">คู่ · EVEN</div>
        <div class="card-amount" id="evenAmount">฿0</div>
        <div class="card-stats" id="evenCount">0 โต๊ะ</div>
        <div class="progress-bar"><div class="progress-fill" id="evenProgress" style="width: 50%;"></div></div>
      </div>
      <!-- Odd -->
      <div class="card odd">
        <div class="card-title">คี่ · ODD</div>
        <div class="card-amount" id="oddAmount">฿0</div>
        <div class="card-stats" id="oddCount">0 โต๊ะ</div>
        <div class="progress-bar"><div class="progress-fill" id="oddProgress" style="width: 50%;"></div></div>
      </div>
    </div>

    <!-- Total Summary -->
    <div class="summary-card">
      <div class="summary-label">ยอดเดิมพันรวมในบ่อ</div>
      <div class="summary-total" id="totalAmount">฿0</div>
    </div>

    <!-- Last Result -->
    <div class="last-result-card">
      <div class="last-result-left">
        <i class="fa-solid fa-scale-balanced scale-icon"></i>
        <div>
          <div class="last-result-text">ผลชั่งกุ้งรอบล่าสุด</div>
          <div class="last-result-weight" id="lastWeight">-- กรัม</div>
        </div>
      </div>
      <div class="winner-badge" id="lastWinner">-</div>
    </div>
  </div>

  <script>
    function formatMoney(amount) {
      return '฿' + amount.toLocaleString('th-TH');
    }

    async function fetchLiveBoard() {
      try {
        const response = await fetch(`${APP_CONFIG.GAS_URL}?action=getDashboard`);
        const data = await response.json();
        
        if (data && data.roundId) {
          document.getElementById('roundIdDisplay').innerText = `รอบ ${data.roundId}`;
          document.getElementById('statusDisplay').innerText = data.status === 'Open' ? 'เปิดรับแทง' : 'ปิดรับแทงแล้ว รอผล';
          
          document.getElementById('evenAmount').innerText = formatMoney(data.totalEven);
          document.getElementById('oddAmount').innerText = formatMoney(data.totalOdd);
          document.getElementById('totalAmount').innerText = formatMoney(data.totalAll);
          
          // คำนวณ Progress Bar
          let total = data.totalAll > 0 ? data.totalAll : 1;
          let evenPercent = (data.totalEven / total) * 100;
          let oddPercent = (data.totalOdd / total) * 100;
          
          document.getElementById('evenProgress').style.width = `${evenPercent}%`;
          document.getElementById('oddProgress').style.width = `${oddPercent}%`;

          // (รอ Backend ส่งข้อมูลจำนวนโต๊ะที่แทง และผลรอบล่าสุดมาเพิ่มเติม)
        }
      } catch (error) {
        console.error("Error fetching live board:", error);
      }
    }

    // Timer จำลอง (ต้องผูกกับ Timestamp การเปิดรอบจาก Backend จริง)
    let timeLeft = 84; // 01:24
    setInterval(() => {
      if(timeLeft > 0) timeLeft--;
      let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      let s = (timeLeft % 60).toString().padStart(2, '0');
      document.getElementById('timerDisplay').innerText = `${m}:${s}`;
    }, 1000);

    // ดึงข้อมูลทุก 3 วินาที
    fetchLiveBoard();
    setInterval(fetchLiveBoard, 3000);
  </script>
</body>
</html>
